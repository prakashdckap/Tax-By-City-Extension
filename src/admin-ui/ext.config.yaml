# Commerce Admin UI SDK extension package (app.config.yaml → extensions.commerce/backend-ui/1 includes this file).
# - web/src → Parcel builds the same SPA as the main application web-src.
# - operations.view.impl → HTML entry the Admin iframe loads after menu click.
# - runtimeManifest.actions.registration → this project’s menu registration (actions/registration/index.js).
# https://developer.adobe.com/commerce/extensibility/admin-ui-sdk/app-registration/
operations:
  view:
    - type: web
      impl: index.html
actions: actions
web:
  src: ../../web-src
runtimeManifest:
  packages:
    admin-ui-sdk:
      license: Apache-2.0
      actions:
        registration:
          function: actions/registration/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: debug
          annotations:
            require-adobe-auth: false
            final: true
